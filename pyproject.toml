[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "InstaAddict-AI"
authors = [
    { name = "ssucipto" }
]
readme = "README.md"
classifiers = [
    "License :: Free for non-commercial use",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3"
]
license = { file = "LICENSE" }
requires-python = ">=3.8"
dynamic = ["version", "description"]
dependencies = [
    "colorama==0.4.4",
    "ConfigArgParse==1.5.3",
    "PyYAML==6.0.1",
    "uiautomator2~=2.16.19",
    "urllib3==1.26.18",
    "emoji==1.6.1",
    "langdetect==1.0.9",
    "atomicwrites==1.4.0",
    "spintax==1.0.4",
    "requests~=2.31.0",
    "packaging~=26.2",
    "standard-pkg-resources>=1.0.0",
    "imageio[ffmpeg]",
    "websocket-client",
    "rich>=13.0.0",
    "google-generativeai>=0.8",
    "python-dotenv>=1.0",
    "pillow>=10",
    "matplotlib>=3.8"
]

[project.optional-dependencies]
dev = ["flit", "pre-commit", "black", "flake8", "isort", "ruff", "pytest", "pytest-mock"]

[project.urls]
Source = "https://github.com/ssucipto/instaaddict"

[project.scripts]
instaaddict = "InstaAddict.__main__:main"
instaaddict-ai = "InstaAddict.__main__:main"

[tool.pytest.ini_options]
testpaths = ["test"]