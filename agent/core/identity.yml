project: InstaAddict-AI
version: 1.4.2
type: cli-tool
description: >-
  Instagram automation software operated by this fork for UK Trade Leads and its
  uk.tradeleads account. The business purpose is relevant awareness among UK trade
  and home-service businesses and support for qualified UK Trade Leads enquiries.
  Start with docs/uk-trade-leads.md for scope, connected projects and outcome
  evidence, then docs/daily-growth-macos.md for operation. The underlying software
  uses Android, ADB and UIAutomator2; its wider capabilities do not authorise
  enabling extra actions for this deployment.
stack:
- primary: Python
- runtime: Python 3.11+ / 3.13
- automation: uiautomator2
- bridge: adb (Android Debug Bridge)
- configuration: YAML / ConfigArgParse
- data: SQLite / JSON / text lists
team: open-source
priorities:
- uk-trade-leads-qualified-enquiries
- anti-detection
- reliability
- safety-limits
- clean-code
repo: github.com/jschof1/instaaddict
capabilities:
- IG v446+ Full-Screen Reels & Modern Action Bar / Media group resolution
- Multi-Tier Hashtag Discovery, Rotation & Pruning Engine (HashtagManager)
- Persistent Non-Bot Followings Cache with Atomic Disk Writes
- In-App Browser & Advertisement Trapping Escape Watchdog
- Multimodal Gemini Vision AI Post Evaluation & Contextual Commenting
- Autonomous Local Queue Post & Reel Uploader (UploadPostsPlugin)
- Native 200ms ADB Flick Gestures & Fluid Single-Swipe Feed Navigation
- Self-Learning Parameter Tuning Engine (DogfoodOptimizer) & Resilient Crash Telemetry
- Modern Terminal User Interface (TUI) & Live Dashboard with Rich Live Layouts

